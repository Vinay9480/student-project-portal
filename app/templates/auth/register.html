{% extends "base.html" %}
{% block title %}Register{% endblock %}

{% block auth_content %}
<div class="auth-page">
  <div class="auth-card">
    <div class="auth-logo">
      <span class="logo-icon">🎓</span>
      StudentPortal
    </div>
    <h2 style="font-size:1.2rem;font-weight:600;margin-bottom:1.25rem;text-align:center;">Create account</h2>

    <form method="POST" action="{{ url_for('auth.register') }}" novalidate>
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}" />

      <div class="form-group">
        <label class="form-label" for="name">Full Name</label>
        <input class="form-control" type="text" id="name" name="name"
               value="{{ name or '' }}" required maxlength="120" />
      </div>
      <div class="form-group">
        <label class="form-label" for="email">Email</label>
        <input class="form-control" type="email" id="email" name="email"
               value="{{ email or '' }}" required />
      </div>
      <div class="form-group">
        <label class="form-label" for="password">Password</label>
        <input class="form-control" type="password" id="password" name="password"
               required minlength="6" />
        <span class="form-text">At least 6 characters.</span>
      </div>
      <div class="form-group">
        <label class="form-label" for="confirm_password">Confirm Password</label>
        <input class="form-control" type="password" id="confirm_password" name="confirm_password" required />
      </div>
      <div class="form-group">
        <label class="form-label" for="role">Register as</label>
        <select class="form-control" id="role" name="role">
          <option value="student" {% if role == 'student' or not role %}selected{% endif %}>Student</option>
          <option value="mentor"  {% if role == 'mentor' %}selected{% endif %}>Mentor</option>
        </select>
      </div>

      <button type="submit" class="btn btn-primary w-100 btn-lg">Create Account</button>
    </form>

    <p class="text-center mt-3 text-small">
      Already have an account?
      <a href="{{ url_for('auth.login') }}">Log in</a>
    </p>
  </div>
</div>
{% endblock %}
