{% extends "base.html" %}
{% block title %}Not Found{% endblock %}
{% block content %}
<div class="error-page">
  <div>
    <div class="error-code">404</div>
    <div class="error-msg">Page Not Found</div>
    <p class="text-muted">The page you're looking for doesn't exist.</p>
    <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary mt-3">Go Home</a>
  </div>
</div>
{% endblock %}
{% block auth_content %}
<div class="error-page">
  <div>
    <div class="error-code">404</div>
    <div class="error-msg">Not Found</div>
    <a href="{{ url_for('auth.login') }}" class="btn btn-primary mt-3">Log In</a>
  </div>
</div>
{% endblock %}
