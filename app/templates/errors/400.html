{% extends "base.html" %}
{% block title %}Bad Request{% endblock %}
{% block content %}
<div class="error-page">
  <div>
    <div class="error-code">400</div>
    <div class="error-msg">Bad Request</div>
    <p class="text-muted">{{ error }}</p>
    <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary mt-3">Go Home</a>
  </div>
</div>
{% endblock %}
{% block auth_content %}
<div class="error-page">
  <div>
    <div class="error-code">400</div>
    <div class="error-msg">Bad Request</div>
    <p class="text-muted">{{ error }}</p>
    <a href="{{ url_for('auth.login') }}" class="btn btn-primary mt-3">Log In</a>
  </div>
</div>
{% endblock %}
