{% extends "base.html" %}
{% block title %}Forbidden{% endblock %}
{% block content %}
<div class="error-page">
  <div>
    <div class="error-code">403</div>
    <div class="error-msg">Access Denied</div>
    <p class="text-muted">You don't have permission to view this page.</p>
    <a href="{{ url_for('main.dashboard') }}" class="btn btn-primary mt-3">Go Home</a>
  </div>
</div>
{% endblock %}
{% block auth_content %}
<div class="error-page">
  <div>
    <div class="error-code">403</div>
    <div class="error-msg">Forbidden</div>
    <a href="{{ url_for('auth.login') }}" class="btn btn-primary mt-3">Log In</a>
  </div>
</div>
{% endblock %}
